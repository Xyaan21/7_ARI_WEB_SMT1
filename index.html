<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linktree Arifian</title>

    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #b9d7f0, #e8f1f8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            min-height: 700px;
            text-align: center;
            padding: 50px 30px 30px;

            border: 2px solid black;
            border-radius: 15px;
        }

        .foto-profil {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .info {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
        }

        .deskripsi {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .link {
            display: flex;
            align-items: center;
            text-decoration: none;

            background-color: white;
            color: #333;

            width: 100%;
            padding: 15px 20px;
            margin-bottom: 15px;

            border: 1px solid black;
            border-radius: 20px;

            font-size: 20px;

            box-shadow: 0 5px 10px rgba(0,0,0,0.2);

            transition: 0.3s;
        }

        .link:hover {
            transform: scale(1.05);
            background-color: #eeeeee;
        }

        .link i {
            font-size: 35px;
            width: 60px;
        }

        .instagram {
            color: #e1306c;
        }

        .spotify {
            color: #1DB954;
        }

        .tiktok {
            color: black;
        }

        .facebook {
            color: #1877F2;
        }

        .whatsapp {
            color: #25D366;
        }

        footer {
            margin-top: 70px;
            font-size: 13px;
            color: #555;
        }

    </style>

</head>

<body>

    <div class="container">

        <img src="Ari teh hijau.jpeg" 
             alt="Foto Profil Arifian"
             class="foto-profil">

        <h1>Arifian Armansyah</h1>

        <p class="info">
            Kelas XI TJKT 2 • Teknik Jaringan Komputer dan Telekomunikasi
        </p>

        <p class="deskripsi">
            Siswa kelas XI TJKT 2 yang aktif dalam kegiatan sekolah.
        </p>


        <a href="https://www.instagram.com/fyan_ri10?igsh=MXFrcjU4MTRja2QxaA=="
           target="_blank"
           class="link">

            <i class="fa-brands fa-instagram instagram"></i>
            Instagram

        </a>


        <a href="https://open.spotify.com/user/3143bbpyug42sdggbgdiocfziemq?si=667b9d07f90a4cdb"
           target="_blank"
           class="link">

            <i class="fa-brands fa-spotify spotify"></i>
            Spotify

        </a>


        <a href="https://www.tiktok.com/@fyan_ri?_r=1&_t=ZS-98NqqRaDeWy"
           target="_blank"
           class="link">

            <i class="fa-brands fa-tiktok tiktok"></i>
            TikTok

        </a>


        <a href="https://www.facebook.com/share/1AUGi2ecqr/"
           target="_blank"
           class="link">

            <i class="fa-brands fa-facebook facebook"></i>
            Facebook

        </a>

        <a href="https://wa.me/qr/KVUSZN5R264TN1"
           target="_blank"
           class="link">

            <i class="fa-brands fa-whatsapp whatsapp"></i>
            WhatsApp

        </a>


        <footer>
            © 2026 Arifian Armansyah
        </footer>

    </div>

</body>
</html>
